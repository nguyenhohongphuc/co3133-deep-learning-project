<text x="957" y="387" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#08776F" text-anchor="middle" dominant-baseline="central">Final h_28 → linear 128 → 10</text>
<text x="957" y="419" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#182D45" text-anchor="middle" dominant-baseline="central">[B, 10] logits</text>
<text x="310" y="371" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526578" text-anchor="middle" dominant-baseline="central">The same LSTM weights are reused</text>
<text x="310" y="400" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526578" text-anchor="middle" dominant-baseline="central">at every timestep; only the final h is classified.</text>
