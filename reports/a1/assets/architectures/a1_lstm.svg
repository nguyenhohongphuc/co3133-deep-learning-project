<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="465" viewBox="0 0 1200 465">
<title>LSTM: image rows as a sequence</title>
<rect width="1200" height="465" fill="white"/>
<text x="25" y="28" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#182D45" text-anchor="start" dominant-baseline="central">LSTM: image rows as a sequence</text>
<text x="1175" y="28" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526578" text-anchor="end" dominant-baseline="central">82,186 parameters · main row variant</text>
<text x="25" y="69" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526578" text-anchor="start" dominant-baseline="central">28 timesteps · 28 pixel values per row · hidden size 128 · one unidirectional layer</text>
