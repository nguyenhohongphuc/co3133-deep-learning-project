seed: 42                         # cùng seed cho mọi model (§10, §12.2)
dataset: fashion_mnist           # không có code nào đọc, chỉ để ghi lại
data_dir: data/                  # loaders.py
split_file: results/a1/splits/split_seed42.json   # loaders.py; file này đã có sẵn

data:
  val_size: 6000                 # split.py (54k train / 6
  stratified: true               # split.py
  normalize: true                # transforms.py
  mean: [0.286209]               # transforms.py, evaluate.py (tính trên tập train)
  std: [0.353160]
  augmentation: none             # transforms.py chỉ chấp nhận "none"

training:
  batch_size: 128                # loaders.py
  num_workers: 2                 # loaders.py
  epochs: 50                     # trainer.py
  loss: cross_entropy            # trainer.build_loss
  optimizer: adam                # trainer.build_optimizer: adam | sgd
  lr: 0.001
  weight_decay: 0.0              # trainer đọc bằng .get, nên ghi ra để báo cáo §3.2
  device: cuda          # auto | cpu | cuda. KHÔN
  monitor: val_macro_f1          # quy tắc chọn checkpoint (§12.2)
  patience: 5                    # early stopping

models:
  linear: {}
  mlp:
    hidden_sizes: [256, 128]
    activation: relu
    dropout: 0.2
  cnn:
    channels: [32, 64]
    kernel_size: 3
    dropout: 0.25
  rnn:
    cell: lstm
    sequence: rows
    patch_size: 7
    hidden_size: 128
    num_layers: 1
    bidirectional: false
  transformer:
    sequence: patches
    patch_size: 7
    d_model: 128
    nhead: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    positional_encoding: learned